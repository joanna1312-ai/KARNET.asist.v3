name: Database backup

on:
  schedule:
    # 02:00 UTC codziennie (~03:00-04:00 czasu polskiego, zaleznie od DST)
    - cron: "0 2 * * *"
  workflow_dispatch: {}

jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      - name: Install PostgreSQL client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client gnupg

      - name: Dump database
        env:
          DATABASE_URL: ${{ secrets.BACKUP_DATABASE_URL }}
        run: pg_dump "$DATABASE_URL" --no-owner --no-privileges -F c -f backup.dump

      - name: Encrypt dump
        env:
          BACKUP_PASSPHRASE: ${{ secrets.BACKUP_PASSPHRASE }}
        run: |
          gpg --batch --yes --passphrase "$BACKUP_PASSPHRASE" --cipher-algo AES256 \
            -c -o "backup-$(date -u +%Y-%m-%d).dump.gpg" backup.dump
          rm backup.dump

      - name: Upload encrypted backup
        uses: actions/upload-artifact@v4
        with:
          name: db-backup-${{ github.run_id }}
          path: backup-*.dump.gpg
          retention-days: 30
