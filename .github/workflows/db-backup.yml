name: Database backup

on:
  schedule:
    # 02:00 UTC codziennie (~03:00-04:00 czasu polskiego, zaleznie od DST)
    - cron: "0 2 * * *"
  workflow_dispatch: {}

jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      - name: Dump database
        env:
          DATABASE_URL: ${{ secrets.BACKUP_DATABASE_URL }}
        run: |
          # Uzywamy obrazu postgres:17, zeby pg_dump zawsze pasowal wersja
          # do serwera Supabase (pg_dump odmawia dzialania na nowszym
          # serwerze niz wlasna wersja - stad Docker zamiast pakietu apt).
          docker run --rm postgres:17 \
            pg_dump "$DATABASE_URL" --no-owner --no-privileges -F c > backup.dump

      - name: Encrypt dump
        env:
          BACKUP_PASSPHRASE: ${{ secrets.BACKUP_PASSPHRASE }}
        run: |
          gpg --batch --yes --passphrase "$BACKUP_PASSPHRASE" --cipher-algo AES256 \
            -c -o "backup-$(date -u +%Y-%m-%d).dump.gpg" backup.dump
          rm backup.dump

      - name: Upload encrypted backup
        uses: actions/upload-artifact@v4
        with:
          name: db-backup-${{ github.run_id }}
          path: backup-*.dump.gpg
          retention-days: 30
